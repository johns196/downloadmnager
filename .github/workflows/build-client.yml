name: Build native clients

# Builds the Flutter client in client/ for Windows, Linux, Android, and
# (compile-check only) iOS on every push to main and on demand. Windows
# and iOS specifically can only be built here or on a real
# Windows/Mac machine -- Flutter cannot cross-compile either from Linux,
# which is why this workflow exists at all rather than just running the
# build locally (see PROGRESS.md "Native app builds" for the full
# context: Linux and Android were already built and verified locally on
# the original dev machine; this workflow is what makes Windows/iOS
# possible, and gives Linux/Android a reproducible from-clean build
# alongside them).
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/build-client.yml"
  workflow_dispatch: {}

env:
  # Linux/Android are pinned to the exact version already validated by a
  # real local build (see PROGRESS.md) -- deliberately not bumped, to
  # avoid trading a known-good result for an unknown one.
  FLUTTER_VERSION: "3.27.1"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Deliberately *not* pinned to FLUTTER_VERSION (3.27.1): that
      # release's Visual Studio detection
      # (packages/flutter_tools/lib/src/windows/visual_studio.dart)
      # only recognizes major version 17 explicitly and falls back to
      # requesting the "Visual Studio 16 2019" CMake generator for
      # anything it doesn't recognize -- which is exactly what happened
      # against this runner's VS2022 install, since a version string this
      # Dec-2024-era Flutter release wasn't tested against didn't parse
      # as major version 17. Using current stable picks up whatever fix
      # landed since. If this job ever regresses, check here first.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: client
        run: flutter pub get
      - working-directory: client
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: download-manager-client-windows
          path: client/build/windows/x64/runner/Release/
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: client
        run: flutter pub get
      - working-directory: client
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: download-manager-client-linux
          path: client/build/linux/x64/release/bundle/
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: client
        run: flutter pub get
      - working-directory: client
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: download-manager-client-android
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    # Produces an *unsigned* .ipa -- not a real distributable build, see
    # PROGRESS.md "iOS" for the full why. iOS enforces code signing at
    # the OS level; there is no unsigned-but-runnable equivalent to
    # Windows's "click through SmartScreen" or Android's
    # sideload-an-APK. This artifact will NOT install on a real device
    # as-is. It exists so it can be fed into a free-Apple-ID sideloading
    # tool (e.g. Sideloadly, AltStore) that does its own signing using
    # the user's own Apple ID -- that signing step has to happen on the
    # user's machine with their own credentials, never here. A real
    # Apple Developer Program membership ($99/year) would allow proper
    # CI-side signing instead (TestFlight/ad-hoc) -- not set up, needs
    # the user's account/cost decision first.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Unpinned for the same reason as build-windows above: avoid
      # re-hitting a platform-detection bug specific to the older
      # version already validated for Linux/Android.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: client
        run: flutter pub get
      - working-directory: client
        run: flutter build ios --release --no-codesign
      - name: Package unsigned .ipa
        working-directory: client
        run: |
          mkdir -p ipa-build/Payload
          cp -r build/ios/iphoneos/Runner.app ipa-build/Payload/
          cd ipa-build
          zip -r ../download-manager-client-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: download-manager-client-ios-unsigned
          path: client/download-manager-client-unsigned.ipa
          if-no-files-found: error
