<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Download Manager</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Download Manager</h1>
      <span id="backend-status" class="status-dot" title="Backend status"></span>
      <button id="settings-btn" class="icon-btn" title="Settings">&#9881;</button>
    </header>

    <section>
      <button id="sniff-btn" class="btn btn-primary">Sniff current tab</button>
      <div id="status" class="muted"></div>
    </section>

    <section id="dom-media-section" hidden>
      <h2>Detected on page</h2>
      <div id="dom-media-list"></div>
    </section>

    <section id="results-section" hidden>
      <h2>Streams found</h2>
      <div id="results-list"></div>
    </section>

    <footer>
      <span class="muted">Add links or manage the full queue in the Download Manager app.</span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
